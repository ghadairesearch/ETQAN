services:
  - type: web
    name: etqan
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    disk:
      name: etqan-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etqan-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: ORG_LOGO_FOLDER
        value: /var/data/uploads/organization_logos

databases:
  - name: etqan-postgres
    databaseName: etqan
    user: etqan
    plan: starter
