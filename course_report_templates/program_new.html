{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 820px; margin: 0 auto;">
    <h2 style="margin-top: 0;">{{ _('programs.add_title') }}</h2>

    <form method="POST">
        <div class="form-group">
            <label class="form-label">{{ _('programs.program_name') }}</label>
            <input type="text" name="program_name" class="form-control" value="{{ draft.program_name|default('', true) }}" required>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">{{ _('programs.program_code') }}</label>
                <input type="text" name="program_code" class="form-control" value="{{ draft.program_code|default('', true) }}">
            </div>
            <div class="form-group">
                <label class="form-label">{{ _('programs.college') }}</label>
                <input type="text" name="college" class="form-control" value="{{ draft.college|default('', true) }}">
            </div>
            <div class="form-group">
                <label class="form-label">{{ _('programs.department') }}</label>
                <input type="text" name="department" class="form-control" value="{{ draft.department|default('', true) }}">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">{{ _('programs.plos') }}</label>
            <textarea name="plos" class="form-control" rows="9" placeholder="{{ _('programs.plos_help') }}" required>{{ draft.plos|default('', true) }}</textarea>
        </div>

        <button type="submit" class="btn save-icon-button" aria-label="{{ _('programs.save') }}" title="{{ _('programs.save') }}">{% include "save_icon.html" %}</button>
    </form>
</div>
{% endblock %}
