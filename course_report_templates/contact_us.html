{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 720px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem;">
        <div>
            <h2 style="margin-top: 0;">{{ _('contact.title') }}</h2>
        </div>
    </div>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label class="form-label">{{ _('contact.enquiry_type') }} <span style="color: var(--danger);">*</span></label>
            <select name="enquiry_type" class="form-control" required>
                <option value="" disabled{% if not topic %} selected{% endif %}>{{ _('contact.enquiry_select') }}</option>
                <option value="subscription"{% if topic == 'university-subscription' %} selected{% endif %}>{{ _('contact.enquiry_sub') }}</option>
                <option value="issue">{{ _('contact.enquiry_issue') }}</option>
                <option value="unsupported">{{ _('contact.enquiry_unsupported') }}</option>
                <option value="suggestion">{{ _('contact.enquiry_suggestion') }}</option>
                <option value="other">{{ _('contact.enquiry_other') }}</option>
            </select>
        </div>
        <div class="form-group">
            <label class="form-label">{{ _('contact.name') }} <span style="color: var(--danger);">*</span></label>
            <input type="text" name="name" class="form-control" required>
        </div>
        <div class="form-group">
            <label class="form-label">{{ _('contact.email') }} <span style="color: var(--danger);">*</span></label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
            <label class="form-label">{{ _('contact.organization') }}</label>
            <input type="text" name="organization" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">{{ _('contact.college') }}</label>
            <input type="text" name="college" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">{{ _('contact.department') }}</label>
            <input type="text" name="department" class="form-control">
        </div>
        <div class="form-group">
            <label class="form-label">{{ _('contact.message') }} <span style="color: var(--danger);">*</span></label>
            <textarea name="message" class="form-control" rows="6" required>{{ default_message }}</textarea>
        </div>
        <div class="form-group">
            <label class="form-label" style="display: flex; align-items: center; gap: 0.35rem;">
                {{ _('contact.attachment') }}
                <span title="{{ _('contact.attachment_help') }}" style="cursor: help; display: inline-flex; color: var(--text-muted);">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                </span>
            </label>
            <input type="file" name="attachment" class="form-control" accept=".csv,.pdf,image/*">
        </div>
        <button type="submit" class="btn">{{ _('contact.submit') }}</button>
    </form>
</div>
{% endblock %}
