{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 820px; margin: 0 auto;">
    <h2 style="margin-top: 0;">{{ _('home.question_mapping_title') }}</h2>
    <p style="color: var(--text-muted); margin-top: -0.5rem;">
        {{ _('home.question_mapping_description') }}
    </p>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label class="form-label">{{ _('index.course') }}</label>
            <div style="display: flex; align-items: stretch; gap: 0.75rem; flex-wrap: wrap;">
                <select name="course_name" id="course_name" class="form-control" required style="flex: 1 1 320px; min-width: 0;">
                    <option value="">{{ _('index.select_course') }}</option>
                    {% for course in courses %}
                        <option value="{{ course.name }}">{{ (course.display_label_ar if language == 'ar' else course.display_label_en) or course.display_label or course.name }}</option>
                    {% endfor %}
                </select>
                <span title="{{ _('index.course_not_found_my_courses') }}" aria-label="{{ _('index.course_not_found_my_courses') }}" style="display: inline-flex; align-items: center; justify-content: center; width: 2.45rem; height: 2.45rem; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); font-weight: 700; text-decoration: none; font-size: 1.2rem; align-self: center; flex-shrink: 0; cursor: help;">
                    i
                </span>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">{{ _('index.exam_paper') }}</label>
            <input type="file" name="exam_paper" class="form-control" accept=".pdf,.docx,.txt" required style="padding: 0.5rem;">
        </div>

        <button type="submit" class="btn">{{ _('home.question_mapping_extract') }}</button>
    </form>
</div>
{% endblock %}
