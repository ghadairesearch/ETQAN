{% extends "base.html" %}

{% block content %}
<style>
    .question-submit-row {
        display: flex;
        direction: ltr;
        justify-content: flex-end;
    }
</style>

<div class="card" style="max-width: 820px; margin: 0 auto;">
    <h2 style="margin-top: 0;">{% if language == 'ar' %}الخطوة 1: رفع ورقة الاختبار{% else %}Step 1: Upload Exam Paper{% endif %}</h2>

    <form method="POST" enctype="multipart/form-data">
        <div class="form-group">
            <label class="form-label">{{ _('index.course') }}</label>
            <div style="display: flex; align-items: stretch; gap: 0.75rem; flex-wrap: wrap;">
                <select name="course_name" id="course_name" class="form-control" required style="flex: 1 1 320px; min-width: 0;">
                    <option value="">{{ _('index.select_course') }}</option>
                    {% for course in courses %}
                        <option value="{{ course.name }}">{{ (course.display_label_ar if language == 'ar' else course.display_label_en) or course.display_label or course.name }}</option>
                    {% endfor %}
                </select>
                <span class="question-course-help-icon" title="{{ _('index.course_not_found_my_courses') }}" aria-label="{{ _('index.course_not_found_my_courses') }}" style="display: inline-flex; align-items: center; justify-content: center; width: 1.05rem; height: 1.05rem; border-radius: 999px; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 0.72rem; font-weight: 700; cursor: help; align-self: center; flex-shrink: 0;">
                    i
                </span>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">{{ _('index.exam_paper') }}</label>
            <input type="file" name="exam_paper" class="form-control" accept=".pdf,.docx,.txt" required style="padding: 0.5rem;">
        </div>

        <div class="question-submit-row" style="justify-content: {{ 'flex-start' if language == 'ar' else 'flex-end' }};">
            <button type="submit" class="btn">{{ _('course_report.continue') }}</button>
        </div>
    </form>
</div>
{% endblock %}
