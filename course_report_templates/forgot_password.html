{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 560px; margin: 0 auto;">
    <h2 style="margin-top: 0;">{{ _('auth.forgot_title') }}</h2>

    <form method="POST">
        <div class="form-group">
            <label class="form-label">{{ _('auth.email') }}</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <button type="submit" class="btn">{{ _('auth.send_reset') }}</button>
        {% if reset_message %}
            <div class="alert {% if reset_message_category == 'error' %}alert-error{% endif %}" style="margin-top: 1rem; margin-bottom: 0;">
                {{ reset_message }}
            </div>
        {% endif %}
    </form>

    <p style="margin-bottom: 0;">
        <a href="/login" style="color: var(--accent); font-weight: 600;">{{ _('auth.back_login') }}</a>
    </p>
</div>
{% endblock %}
