{% extends "base.html" %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 0 auto;">
    <h2 style="margin-top: 0;">{{ _('auth.forgot_title') }}</h2>

    <form method="POST">
        <div class="form-group">
            <label class="form-label">{{ _('auth.new_password') }}</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label class="form-label">{{ _('auth.confirm_password') }}</label>
            <input type="password" name="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn">{{ _('auth.reset_button') }}</button>
    </form>

    <p style="margin-bottom: 0;">
        <a href="/login" style="color: var(--accent); font-weight: 600;">{{ _('auth.back_login') }}</a>
    </p>
</div>
{% endblock %}
